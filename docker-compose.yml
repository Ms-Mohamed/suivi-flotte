services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
  app:
    build: .
    restart: unless-stopped
    depends_on: [mongo]
    ports: ["4000:4000"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/suivi_flotte
      JWT_SECRET: ${JWT_SECRET:?définissez JWT_SECRET dans .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?définissez ADMIN_EMAIL dans .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?définissez ADMIN_PASSWORD dans .env}
      BACKUP_DIR: /data/backups
      BACKUP_HOUR: "2"
      BACKUP_KEEP: "30"
      TZ: Africa/Casablanca
    volumes:
      - ./backups:/data/backups
volumes:
  mongo_data:
